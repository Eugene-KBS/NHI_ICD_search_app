<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="醫療碼">
<meta name="mobile-web-app-capable" content="yes">
<title>醫療碼搜尋（健保碼 + ICD-10-CM）</title>
<style>
  :root{
    --bg:#f1f5f9;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;
    --blue:#2563eb;--blue-soft:#eff6ff;--green:#047857;--green-soft:#ecfdf5;--green-line:#a7f3d0;
    --teal:#0d9488;--teal-soft:#f0fdfa;--amber-bg:#fef3c7;--amber-ink:#b45309;--amber-line:#fde68a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);padding-bottom:96px;line-height:1.4;font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Roboto,Arial,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}
  .bar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .bar-inner{max-width:760px;margin:0 auto;padding:10px 16px 12px;}
  /* tabs */
  .tabs{display:flex;gap:6px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:10px;}
  .tab{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:9px;font-size:14px;font-weight:700;color:#64748b;cursor:pointer;transition:.15s;}
  .tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .tab.on.icd{color:var(--teal);}
  .field{position:relative;}
  .field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#94a3b8;pointer-events:none;}
  #q{width:100%;padding:12px 14px 12px 40px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-size:16px;outline:none;transition:.15s;}
  #q:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15);}
  body.icd #q:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.15);}
  .status{font-size:12px;color:#64748b;margin:8px 2px 0;display:flex;align-items:center;gap:6px;}
  .spin{width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .list{padding:14px 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 44px 14px 16px;margin-bottom:10px;position:relative;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;user-select:none;}
  .card:active{transform:scale(.985);}
  .card.sel{background:var(--blue-soft);border-color:var(--blue);box-shadow:0 0 0 2px var(--blue);}
  .check{position:absolute;top:13px;right:13px;width:24px;height:24px;border-radius:50%;border:1px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;color:transparent;transition:.12s;}
  .card.sel .check{background:var(--blue);border-color:var(--blue);color:#fff;}
  .check svg{width:15px;height:15px;}
  .copyhint{position:absolute;top:14px;right:14px;font-size:11px;color:#94a3b8;}
  .tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:14px;letter-spacing:.3px;background:#dbeafe;color:#1e40af;padding:3px 8px;border-radius:6px;}
  body.icd .code{background:var(--teal-soft);color:#0f766e;border:1px solid #99f6e4;}
  .card.sel .code{background:var(--blue);color:#fff;}
  .pts{display:inline-flex;align-items:baseline;gap:4px;font-weight:700;color:var(--green);background:var(--green-soft);border:1px solid var(--green-line);padding:3px 8px;border-radius:8px;font-size:14px;}
  .pts small{font-size:11px;font-weight:500;color:#059669;}
  .zh{font-size:16px;font-weight:500;color:#0f172a;margin:0 0 2px;line-height:1.35;}
  .en{font-size:13px;color:#64748b;font-family:ui-monospace,Menlo,Consolas,monospace;margin:0;line-height:1.45;}
  mark{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px;}
  .empty{text-align:center;padding:56px 16px;color:#94a3b8;}
  .more{text-align:center;color:#94a3b8;font-size:13px;padding:8px 0 4px;}
  .crow{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 44px 14px 16px;margin-bottom:10px;position:relative;}
  .rank{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#f1f5f9;color:#64748b;margin-top:2px;}
  .rank.top{background:var(--amber-bg);color:var(--amber-ink);box-shadow:0 0 0 2px var(--amber-line);}
  .crow .body{min-width:0;flex:1;}
  .rm{position:absolute;top:9px;right:9px;width:32px;height:32px;border:none;background:transparent;color:#cbd5e1;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .rm:hover{color:#ef4444;background:#fef2f2;}.rm svg{width:18px;height:18px;}
  .iconbtn{border:none;background:transparent;padding:8px;margin-left:-8px;border-radius:50%;cursor:pointer;color:#475569;display:flex;}
  .iconbtn:hover{background:#f1f5f9;}.iconbtn svg{width:24px;height:24px;}
  .htitle{font-size:18px;font-weight:700;margin:0;color:#1e293b;}
  .hsub{font-size:12px;color:#64748b;margin:2px 0 0;}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:16px;z-index:50;pointer-events:none;}
  .foot-inner{max-width:760px;margin:0 auto;pointer-events:auto;}
  .gobtn{width:100%;border:none;cursor:pointer;padding:14px 20px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(30,64,175,.28);background:linear-gradient(90deg,var(--blue),#4f46e5);transition:transform .2s,opacity .2s;}
  .gobtn.hide{transform:translateY(80px);opacity:0;pointer-events:none;}
  .gobtn .badge{background:#fff;color:var(--blue);min-width:24px;height:24px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
  .gobtn .lhs{display:flex;align-items:center;gap:12px;}.gobtn .rhs{font-size:13px;font-weight:500;color:#dbeafe;}
  .backbtn{width:100%;border:none;cursor:pointer;padding:14px 20px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;background:#1e293b;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .backbtn svg{width:18px;height:18px;}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

  .tags{margin-bottom:6px;}
  .sect{font-size:11px;color:#64748b;background:#f1f5f9;border-radius:6px;padding:2px 7px;}
  .nb{font-size:11px;color:#92400e;background:#fef3c7;border-radius:6px;padding:2px 7px;}
  .card.dim{opacity:.55;}
  .card.dim.sel{opacity:.9;}
  .notebtn{display:inline-flex;align-items:center;min-height:40px;margin:2px 0 -8px -8px;padding:0 8px;border:none;background:transparent;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;}
  .note{display:none;margin:6px -28px 0 0;padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;font-size:13px;color:#334155;cursor:default;user-select:text;-webkit-user-select:text;}
  .note b{display:block;font-size:11px;color:#64748b;margin-bottom:4px;}
  .note div{white-space:pre-wrap;word-break:break-word;}
  .card.open .note{display:block;}
  .sec-h{font-size:12px;font-weight:700;color:#64748b;margin:14px 2px 8px;letter-spacing:.5px;}
  .sec-h:first-child{margin-top:0;}
  .part-h{font-size:13px;font-weight:700;color:#334155;margin:16px 2px 8px;}
  .part-h:first-child{margin-top:0;}
  .part-h span{color:var(--blue);margin-right:4px;}
  body.icd .part-h span{color:var(--teal);}
  .morebtn{display:block;width:100%;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;color:#475569;font-size:14px;font-weight:600;cursor:pointer;margin:0 0 10px;}
  .hint{text-align:center;padding:48px 16px;color:#94a3b8;font-size:15px;}
  .foot-note{text-align:center;color:#94a3b8;font-size:11px;padding:14px 8px 4px;line-height:1.6;}
  .clr{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;background:transparent;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .clr svg{width:18px;height:18px;}
  #q{padding-right:42px;}
  .status:empty{margin:0;}
  #q::placeholder{font-size:14px;color:#94a3b8;}
  .status.warn{color:#b45309;}
  .crow{padding:12px 6px 12px 14px;}
  .crow .body{cursor:pointer;}
  .crow .act{display:flex;align-items:center;flex-shrink:0;margin-top:-4px;}
  .rm,.up{position:static;width:40px;height:40px;border:none;background:transparent;color:#64748b;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
  .rm svg{width:18px;height:18px;}
  .up:hover{color:var(--blue);background:var(--blue-soft);}
  .main-tag{font-size:11px;font-weight:700;color:var(--amber-ink);background:var(--amber-bg);border-radius:6px;padding:2px 7px;}
  .total{font-weight:700;color:var(--green);text-align:right;margin:2px 4px 6px;font-size:15px;}
  .total small{display:block;font-weight:500;font-size:11px;color:#64748b;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip{min-height:40px;border:1px solid var(--blue);background:var(--blue-soft);color:#1e40af;border-radius:999px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;max-width:100%;}
  .chip b{font-family:ui-monospace,Menlo,Consolas,monospace;margin-right:6px;}
  .links{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin:18px 0 8px;}
  .lnk{min-height:40px;border:none;background:transparent;color:#64748b;font-size:13px;text-decoration:underline;cursor:pointer;padding:0 4px;}
  .foot-inner .row{display:flex;gap:10px;}
  .foot-inner .row button{flex:1;}
  .btn1{border:none;cursor:pointer;padding:14px 10px;min-height:48px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--blue),#4f46e5);box-shadow:0 8px 24px rgba(30,64,175,.28);}
  .btn2{border:none;cursor:pointer;padding:14px 10px;min-height:48px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;background:#1e293b;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .gobtn{min-height:48px;}
  .gobtn .rhs{color:#dbeafe;}
  .foot{padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom));width:max-content;max-width:90vw;text-align:center;}
  body{padding-bottom:calc(100px + env(safe-area-inset-bottom));overflow-x:hidden;}
  .wrap,.bar-inner{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));}
  .zh,.en{word-break:break-word;}
  .tab{min-height:40px;}
  .iconbtn{min-width:40px;min-height:40px;align-items:center;justify-content:center;}
</style>
</head>
<body>

<!-- ===== 搜尋畫面 ===== -->
<div id="searchView">
  <div class="bar"><div class="bar-inner">
    <div class="tabs">
      <button class="tab on" id="tabNhi" data-tab="nhi">健保碼</button>
      <button class="tab" id="tabIcd" data-tab="icd">ICD-10-CM</button>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="搜尋">
      <button class="clr hidden" id="clr" aria-label="清除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div id="status" class="status"></div>
  </div></div>
  <div class="wrap"><div id="results" class="list"></div></div>
</div>

<!-- ===== 病人清單 ===== -->
<div id="patientView" class="hidden">
  <div class="bar"><div class="bar-inner" style="display:flex;align-items:center;gap:12px;">
    <button class="iconbtn" id="toSearch" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div><h1 class="htitle">本次病人</h1><p class="hsub">診斷依點選順序・手術依點數高 → 低</p></div>
  </div></div>
  <div class="wrap"><div id="patientList" class="list"></div></div>
</div>

<div class="foot"><div class="foot-inner">
  <button id="goPatient" class="gobtn hide">
    <span class="lhs" id="goL">本次病人　</span><span class="rhs" id="goR"></span>
  </button>
  <div id="pBtns" class="row hidden">
    <button class="btn1" id="copyAll">複製全部</button>
    <button class="btn2" id="finish">完成並清空</button>
  </div>
</div></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<div id="toast" class="toast"></div>

<script src="./search.js"></script>
<script src="./learn.js"></script>
<script>
'use strict';
const EMBED = /[?&]embed=1\b/.test(location.search);
const RESULT_CAP = 300, PAGE = 60, PART_FIRST = 8, PART_PAGE = 20;
const NHI_COMMON = ['48004C','48005C','48006C','48001C','62014C','62015B','62007C','62045B','62046C','62047C','62018C','62025B','62032B','62073B','62010C','62001C','64153B','64090C','83094B','64025C'];
const CIRC = ['①','②','③','④'];
const PLACEHOLDER={nhi:'代碼、中英文、縮寫（STSG、清創）',icd:'代碼、中英文、縮寫（keloid、rt fx）'};
const NHI_SAMPLE_ROWS = [
  ['62032B','顯微血管游離瓣手術 － 皮瓣移植','Microvascular free flap - skin flap',46539,'',''],
  ['64153B','斷指再接手術 － 一隻手指','Replantation of finger',26157,'','']
];
const ICD_SAMPLE = 'L91.0|蟹足腫（瘢痕疙瘩）|Hypertrophic scar (keloid)\nS62.610A|右側食指近端指骨移位閉鎖性骨折之初期照護|Displaced fracture of proximal phalanx of right index finger, initial encounter for closed fracture\nC44.90|皮膚惡性腫瘤，未明示|Malignant neoplasm of skin, unspecified';

/* ── 安全儲存（Safari 私密模式、額度滿都不能讓 app 壞掉）── */
const store = {
  getItem(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } },
  setItem(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
};
let L;
try{ L = MedLearn.create(store); }catch(e){ L = null; }
if(!L){ const z=()=>0; L={recordUse:z,usageBoost:z,recent:()=>[],frequent:()=>[],commitCase:()=>false,assocBoost:z,suggest:()=>[],recordMiss:z,misses:()=>[],clearMisses:z,exportData:()=>'{}',importData:()=>false,stats:()=>({}),reset:z}; }
function safe(fn, dflt){ try{ return fn(); }catch(e){ return dflt; } }

/* ── 狀態 ── */
let engine = null, lexicon = null, nhiDate = '', usingSample = false;
let nhiReady = false, loadingMsg = '載入資料中…';
let tab = 'nhi';
const TERM = { nhi:'', icd:'' };
let tray = { dx:[], op:[] };          // 項目：{c, zh, en, p}
try{ const t=JSON.parse(store.getItem('medcode.tray.v1')||'null'); if(t && Array.isArray(t.dx) && Array.isArray(t.op)) tray={dx:t.dx.filter(x=>x&&x.c),op:t.op.filter(x=>x&&x.c)}; }catch(e){}
let cur = null;                        // 目前搜尋結果 {kind,q,res,shown,partShown}
const openNotes = new Set();
let missTimer = null, lastNote = '';

/* ── 小工具 ── */
const $ = id => document.getElementById(id);
const elResults=$('results'), elQ=$('q'), elStatus=$('status'), elToast=$('toast'), elPatient=$('patientList');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hl(text, terms){ try{ return MedSearch.highlight(text, terms||[]); }catch(e){ return esc(text); } }
function fmt(n){ return Number(n||0).toLocaleString('en-US'); }
const checkSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const xSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

function showToast(msg, ms){ elToast.textContent=msg; elToast.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>elToast.classList.remove('show'), ms||1600); }
function copyText(text){
  return new Promise(resolve=>{
    const fallback=()=>{
      try{
        const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
        const ok=document.execCommand('copy'); document.body.removeChild(ta); resolve(!!ok);
      }catch(e){ resolve(false); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(fallback); }
    else fallback();
  });
}

/* ── 病人清單資料 ── */
function trayCodes(){ return tray.dx.map(x=>x.c).concat(tray.op.map(x=>x.c)); }
function inTray(kind, code){ return (kind==='icd'?tray.dx:tray.op).some(x=>x.c===code); }
function saveTray(){ store.setItem('medcode.tray.v1', JSON.stringify(tray)); }
function opsSorted(){ return tray.op.slice().sort((a,b)=>(b.p||0)-(a.p||0)); }
function entryOf(rec){ return { c:rec.code, zh:rec.zh||'', en:rec.en||'', p:rec.points==null?0:Number(rec.points) }; }
function addToTray(rec){
  const list = rec.kind==='icd' ? tray.dx : tray.op;
  if(!list.some(x=>x.c===rec.code)) list.push(entryOf(rec));
  safe(()=>L.recordUse(rec.kind, rec.code)); saveTray(); refreshBar();
}
function removeFromTray(kind, code){
  const k = kind==='icd' ? 'dx' : 'op';
  tray[k] = tray[k].filter(x=>x.c!==code); saveTray(); refreshBar();
}
function refreshBar(){
  const n = tray.dx.length + tray.op.length;
  $('goR').textContent = '診斷 '+tray.dx.length+'・手術 '+tray.op.length+'　›';
  const inSearch = !$('searchView').classList.contains('hidden');
  $('goPatient').classList.toggle('hide', !(n>0 && inSearch));
}
function markSel(kind, code){
  const on = inTray(kind, code);
  elResults.querySelectorAll('.card').forEach(c=>{ if(c.dataset.code===code && c.dataset.kind===kind) c.classList.toggle('sel', on); });
}
function recOf(kind, code){ return engine ? safe(()=>engine.get(kind, code), undefined) : undefined; }
function shortZh(s){ s=String(s||'').replace(/\s*[－-]\s*/g,' '); return s.length>10 ? s.slice(0,10)+'…' : s; }

/* ── 卡片 ── */
function cardHTML(r, kind){
  const rec=r.rec, on=inTray(kind, rec.code), t=r.terms||[];
  let h='<div class="card'+(on?' sel':'')+((kind==='icd' && rec.billable===false)?' dim':'')+(openNotes.has(rec.code)?' open':'')+'" data-kind="'+kind+'" data-code="'+esc(rec.code)+'">'
    +'<div class="check">'+checkSVG+'</div><div class="tags"><span class="code">'+esc(rec.code)+'</span>';
  if(kind==='nhi'){
    if(rec.points!=null) h+='<span class="pts">'+fmt(rec.points)+' <small>pts</small></span>';
    const lab = rec.sect && rec.sect.label; if(lab) h+='<span class="sect">'+esc(lab)+'</span>';
  } else if(rec.billable===false) h+='<span class="nb">上層碼・不可申報</span>';
  h+='</div>';
  if(rec.zh) h+='<p class="zh">'+hl(rec.zh,t)+'</p>';
  if(rec.en) h+='<p class="en">'+hl(rec.en,t)+'</p>';
  if(kind==='nhi' && rec.note){
    h+='<button class="notebtn" data-act="note">規範 '+(openNotes.has(rec.code)?'▴':'▾')+'</button>'
      +'<div class="note"><b>健保署支付規範（官方原文）</b><div>'+esc(rec.note)+'</div></div>';
  }
  return h+'</div>';
}
function plainCard(rec, kind){ return cardHTML({rec:rec, terms:[]}, kind); }

/* ── 搜尋 ── */
function boostFn(kind){
  const tc = trayCodes();
  return code => safe(()=>L.usageBoost(kind,code),0) + safe(()=>L.assocBoost(code,tc),0);
}
function runSearch(){
  clearTimeout(missTimer);
  const q = TERM[tab], kind = tab;
  if(!q.trim()){ cur=null; lastNote=''; renderEmpty(); updateStatus(); return; }
  if(!engine || !engine.ready(kind)){ cur=null; lastNote=''; elResults.innerHTML='<div class="hint">'+(kind==='icd'?'ICD 索引建立中…':'載入資料中…')+'</div>'; updateStatus(); return; }
  let res;
  try{ res = engine.search(kind, q, { limit:RESULT_CAP, boost:boostFn(kind) }); }
  catch(e){ res = { rows:[], total:0, notes:[] }; }
  cur = { kind:kind, q:q, res:res, shown:PAGE, partShown:{} };
  lastNote = notesText(res.notes||[]);
  renderResults(); updateStatus();
  if(q.trim().length>=3){
    const partialOnly = res.rows.length>0 && res.rows.every(r=>r.via==='partial');
    if(res.rows.length===0 || partialOnly) missTimer=setTimeout(()=>{ if(TERM[kind]===q) safe(()=>L.recordMiss(kind,q)); }, 2500);
  }
}
function notesText(notes){
  const out=[];
  notes.forEach(n=>{
    if(n.type==='fix') out.push('已修正：'+n.from+' → '+n.to);
    else if(n.type==='syn') out.push('同義：'+n.from+' → '+n.to);
    else if(n.type==='partial') out.push('找不到完全符合，以下為部分符合（未含：'+(n.dropped||[]).join('、')+'）');
    else if(n.type==='split') out.push('已拆成 '+(n.labels||[]).length+' 個診斷分別搜尋');
  });
  return out.join('　');
}
function updateStatus(){
  let msg='', spin=false, warn=false;
  if(lastNote){ msg=lastNote; warn=/找不到/.test(lastNote); }
  else if(!nhiReady) { msg=loadingMsg; spin=true; }
  else if(tab==='icd' && engine && !engine.ready('icd')){ msg='ICD 索引建立中…'; spin=true; }
  else if(usingSample){ msg='（示範資料：找不到 nhi.json / icd.txt）'; }
  elStatus.className='status'+(warn?' warn':'');
  elStatus.innerHTML=(spin?'<span class="spin"></span>':'')+esc(msg);
}
function footerHTML(){
  return '<div class="foot-note">健保碼資料日期 '+esc(nhiDate||'—')+'（健保署開放資料，每月自動更新）・ICD-10-CM 2023 年版</div>';
}
function renderResults(){
  if(!cur) return;
  const res=cur.res, kind=cur.kind;
  let html='';
  if(res.parts && res.parts.length){
    res.parts.forEach((p,i)=>{
      const shown = cur.partShown[i] || PART_FIRST;
      html+='<div class="part-h"><span>'+(CIRC[i]||(i+1))+'</span>'+esc(p.label)+'</div>';
      if(!p.rows.length) html+='<div class="more">沒有符合的項目</div>';
      html+=p.rows.slice(0,shown).map(r=>cardHTML(r,kind)).join('');
      if(p.rows.length>shown) html+='<button class="morebtn" data-act="partmore" data-i="'+i+'">顯示更多（還有 '+(p.rows.length-shown)+' 筆）</button>';
    });
  } else if(!res.rows.length){
    html='<div class="empty">沒有符合的項目</div>';
  } else {
    html=res.rows.slice(0,cur.shown).map(r=>cardHTML(r,kind)).join('');
    if(res.rows.length>cur.shown) html+='<button class="morebtn" data-act="more">顯示更多（還有 '+(res.rows.length-cur.shown)+' 筆）</button>';
    else if(res.total>res.rows.length) html+='<div class="more">顯示前 '+res.rows.length+' 筆（共 '+res.total+' 筆符合），請輸入更精確關鍵字</div>';
  }
  elResults.innerHTML=html+footerHTML();
}
function renderEmpty(){
  const kind=tab; let html='';
  if(!engine || !engine.ready(kind)){
    elResults.innerHTML='<div class="hint">'+(kind==='icd'?'ICD 索引建立中…':'載入資料中…')+'</div>'; return;
  }
  const seen=new Set(), tc=trayCodes();
  const sec=(title, codes)=>{
    const recs=[]; codes.forEach(c=>{ if(seen.has(c)) return; const r=recOf(kind,c); if(r){ seen.add(c); recs.push(r); } });
    if(recs.length) html+='<div class="sec-h">'+esc(title)+'</div>'+recs.map(r=>plainCard(r,kind)).join('');
    return recs.length;
  };
  let n=0;
  if(tc.length) n+=sec('常與已選項目一起用', safe(()=>L.suggest(kind,tc,6),[]).map(x=>x.code));
  n+=sec('最近使用', safe(()=>L.recent(kind,10),[]));
  n+=sec('最常用', safe(()=>L.frequent(kind,10),[]));
  if(!n){
    if(kind==='nhi') sec('整外常用', NHI_COMMON);
    else html='<div class="hint">輸入關鍵字、縮寫或代碼開始搜尋</div>';
  }
  elResults.innerHTML=html+footerHTML();
}
function renderAny(){ if(TERM[tab].trim()) runSearch(); else { cur=null; renderEmpty(); } }

/* ── 點卡片 ── */
elResults.addEventListener('click', e=>{
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='note'){
      const card=act.closest('.card'), code=card.dataset.code;
      const open=card.classList.toggle('open'); if(open) openNotes.add(code); else openNotes.delete(code);
      act.textContent='規範 '+(open?'▴':'▾'); return;
    }
    if(a==='more' && cur){ cur.shown+=PAGE; renderResults(); return; }
    if(a==='partmore' && cur){ const i=+act.dataset.i; cur.partShown[i]=(cur.partShown[i]||PART_FIRST)+PART_PAGE; renderResults(); return; }
  }
  if(e.target.closest('.note')) return;
  const card=e.target.closest('.card'); if(!card) return;
  const kind=card.dataset.kind, code=card.dataset.code;
  if(inTray(kind,code)){ removeFromTray(kind,code); markSel(kind,code); if(kind==='icd') showToast('已移除 '+code); return; }
  const rec=recOf(kind,code); if(!rec) return;
  addToTray(rec); markSel(kind,code);
  if(kind==='icd'){
    copyText(code).then(ok=>showToast(ok ? '已複製 '+code+'・已加入病人清單' : code+'・已加入病人清單（請手動複製）', ok?1600:3000));
  }
});

/* ── 分頁 / 輸入 ── */
function setTab(which){
  tab=which;
  $('tabNhi').classList.toggle('on',which==='nhi');
  $('tabIcd').classList.toggle('on',which==='icd'); $('tabIcd').classList.toggle('icd',which==='icd');
  document.body.classList.toggle('icd',which==='icd');
  elQ.placeholder=PLACEHOLDER[which]; elQ.value=TERM[which];
  $('clr').classList.toggle('hidden',!elQ.value);
  lastNote=''; runSearch(); window.scrollTo(0,0);
}
let deb;
elQ.addEventListener('input',()=>{ TERM[tab]=elQ.value; $('clr').classList.toggle('hidden',!elQ.value); clearTimeout(deb); deb=setTimeout(runSearch,80); });
elQ.addEventListener('keydown',e=>{ if(e.key==='Enter') elQ.blur(); });
$('clr').addEventListener('click',()=>{ elQ.value=''; TERM[tab]=''; $('clr').classList.add('hidden'); runSearch(); elQ.focus(); });
$('tabNhi').addEventListener('click',()=>setTab('nhi'));
$('tabIcd').addEventListener('click',()=>setTab('icd'));

/* ── 病人畫面 ── */
function copyAllText(){
  const lines=[];
  if(tray.dx.length){ lines.push('【診斷】'); tray.dx.forEach((x,i)=>lines.push((i+1)+'. '+x.c+' '+(x.zh||x.en))); }
  const ops=opsSorted();
  if(ops.length){ lines.push('【手術／處置】'); ops.forEach((x,i)=>lines.push((i+1)+'. '+x.c+' '+(x.zh||x.en)+(x.p?'（'+fmt(x.p)+' 點）':''))); }
  return lines.join('\n');
}
function renderPatient(){
  const ops=opsSorted();
  if(!tray.dx.length && !ops.length){
    elPatient.innerHTML='<div class="empty">清單是空的<br><span style="font-size:14px">回搜尋頁點卡片即可加入</span></div>'+linksHTML(); return;
  }
  let h='';
  if(tray.dx.length){
    h+='<div class="sec-h">診斷</div>';
    h+=tray.dx.map((x,i)=>'<div class="crow" data-kind="icd" data-code="'+esc(x.c)+'"><div class="rank'+(i===0?' top':'')+'">'+(i+1)+'</div>'
      +'<div class="body"><div class="tags"><span class="code">'+esc(x.c)+'</span>'+(i===0?'<span class="main-tag">主診斷</span>':'')+'</div>'
      +'<p class="zh">'+esc(x.zh)+'</p>'+(x.en?'<p class="en">'+esc(x.en)+'</p>':'')+'</div>'
      +'<div class="act">'+(i>0?'<button class="up" data-act="up" aria-label="上移">↑</button>':'')+'<button class="rm" data-act="rm" aria-label="移除">'+xSVG+'</button></div></div>').join('');
  }
  if(ops.length){
    h+='<div class="sec-h">手術／處置</div>';
    h+=ops.map((x,i)=>'<div class="crow" data-kind="nhi" data-code="'+esc(x.c)+'"><div class="rank'+(i<3?' top':'')+'">'+(i+1)+'</div>'
      +'<div class="body"><div class="tags"><span class="code">'+esc(x.c)+'</span>'+(x.p?'<span class="pts">'+fmt(x.p)+' <small>pts</small></span>':'')+'</div>'
      +'<p class="zh">'+esc(x.zh)+'</p>'+(x.en?'<p class="en">'+esc(x.en)+'</p>':'')+'</div>'
      +'<div class="act"><button class="rm" data-act="rm" aria-label="移除">'+xSVG+'</button></div></div>').join('');
    const total=ops.reduce((s,x)=>s+(x.p||0),0);
    h+='<div class="total">合計 '+fmt(total)+' 點<small>（單純加總，未套用多項手術折扣）</small></div>';
  }
  const tc=trayCodes(), sug=[];
  ['icd','nhi'].forEach(k=>safe(()=>L.suggest(k,tc,6),[]).forEach(s=>{ const r=recOf(k,s.code); if(r) sug.push({r:r,n:s.n}); }));
  sug.sort((a,b)=>b.n-a.n);
  if(sug.length){
    h+='<div class="sec-h">常一起用</div><div class="chips">'+sug.slice(0,6).map(s=>'<button class="chip" data-act="chip" data-kind="'+s.r.kind+'" data-code="'+esc(s.r.code)+'"><b>'+esc(s.r.code)+'</b>'+esc(shortZh(s.r.zh||s.r.en))+'</button>').join('')+'</div>';
  }
  elPatient.innerHTML=h+linksHTML();
}
function linksHTML(){
  return '<div class="links"><button class="lnk" data-act="clearraw">直接清空（不記錄）</button><button class="lnk" data-act="export">匯出使用紀錄</button><button class="lnk" data-act="import">匯入使用紀錄</button></div>';
}
function showView(v){
  clearTimeout(showToast._t); elToast.classList.remove('show');
  $('searchView').classList.toggle('hidden',v!=='search');
  $('patientView').classList.toggle('hidden',v!=='patient');
  $('pBtns').classList.toggle('hidden',v!=='patient');
  if(v==='patient'){ renderPatient(); $('goPatient').classList.add('hide'); }
  else { refreshBar(); renderAny(); }
  window.scrollTo(0,0);
}
function commit(){
  const dx=tray.dx.map(x=>x.c), op=opsSorted().map(x=>x.c);
  return safe(()=>L.commitCase(dx,op),false);
}
function download(name, text){
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){ navigator.share({files:[file],title:name}).catch(()=>{}); return; }
  }catch(e){}
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }catch(e){ showToast('匯出失敗'); }
}
elPatient.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]'), row=e.target.closest('.crow');
  if(act){
    const a=act.dataset.act;
    if(a==='rm'&&row){ removeFromTray(row.dataset.kind,row.dataset.code); renderPatient(); return; }
    if(a==='up'&&row){ const i=tray.dx.findIndex(x=>x.c===row.dataset.code); if(i>0){ const t=tray.dx[i]; tray.dx[i]=tray.dx[i-1]; tray.dx[i-1]=t; saveTray(); renderPatient(); } return; }
    if(a==='chip'){ const r=recOf(act.dataset.kind,act.dataset.code); if(r){ addToTray(r); renderPatient(); } return; }
    if(a==='clearraw'){ tray={dx:[],op:[]}; saveTray(); showToast('已清空（未記錄）'); showView('search'); return; }
    if(a==='export'){ const d=new Date(), p=n=>String(n).padStart(2,'0'); download('medcode-usage-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json', safe(()=>L.exportData(),'{}')); return; }
    if(a==='import'){ $('importFile').click(); return; }
  }
  if(row && e.target.closest('.body')){ const c=row.dataset.code; copyText(c).then(ok=>showToast(ok?'已複製 '+c:c, ok?1400:3000)); }
});
$('importFile').addEventListener('change',e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const ok=safe(()=>L.importData(String(rd.result),{merge:true}),false); showToast(ok?'已匯入使用紀錄':'檔案格式不正確',2200); if(ok) renderPatient(); };
  rd.onerror=()=>showToast('讀取失敗');
  rd.readAsText(f); e.target.value='';
});
$('goPatient').addEventListener('click',()=>showView('patient'));
$('toSearch').addEventListener('click',()=>showView('search'));
$('copyAll').addEventListener('click',()=>{
  if(!tray.dx.length && !tray.op.length) return;
  const text=copyAllText(); commit();
  copyText(text).then(ok=>showToast(ok?'已複製・已學習這組搭配':'無法自動複製，請改點單一代碼', ok?1800:3000));
});
$('finish').addEventListener('click',()=>{
  if(!tray.dx.length && !tray.op.length){ showView('search'); return; }
  commit(); tray={dx:[],op:[]}; saveTray(); showToast('已學習並清空'); showView('search');
});

/* ── 載入資料 ── */
async function fetchText(u){ const r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.text(); }
async function boot(){
  refreshBar(); updateStatus();
  let nhiRows;
  try{ lexicon = JSON.parse(await fetchText('lexicon.json')); }catch(e){ lexicon=null; }
  engine = MedSearch.createEngine({ lexicon:lexicon });
  try{
    const obj = JSON.parse(await fetchText('nhi.json'));
    nhiRows = MedSearch.parseNhiJson(obj); nhiDate = obj.date || '';
    if(!nhiRows.length) throw new Error('empty');
  }catch(e){ usingSample=true; nhiRows=MedSearch.parseNhiJson({rows:NHI_SAMPLE_ROWS}); }
  await engine.loadAsync('nhi', nhiRows, { sliceMs:12 });
  nhiReady=true; setTab(tab);
  loadIcd();
}
async function loadIcd(){
  document.body.dataset.icd='loading';
  let rows, aliases=null;
  try{
    const txt = await fetchText('icd.txt');
    rows = MedSearch.parseIcdTxt(txt);
    if(!rows.length) throw new Error('empty');
    try{ aliases = MedSearch.parseAliasTxt(await fetchText('icd_alias.txt')); }catch(e){ aliases=null; }
  }catch(e){ usingSample=true; rows=MedSearch.parseIcdTxt(ICD_SAMPLE); }
  try{ await engine.loadAsync('icd', rows, { aliases:aliases, sliceMs:12 }); }catch(e){ showToast('ICD 索引建立失敗'); }
  document.body.dataset.icd = engine.ready('icd') ? 'ready' : 'failed';
  updateStatus();
  if(tab==='icd') renderAny();
}
boot();

/* ── PWA ── */
if(!EMBED && 'serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
