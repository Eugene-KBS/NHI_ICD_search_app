name: Update NHI fee schedule

on:
  schedule:
    - cron: "17 19 1 * *"   # monthly, 1st at 19:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build nhi.json from the official file
        run: python3 tools/build_nhi.py --fetch --out nhi.json
      - name: Self-test
        run: python3 -I tests/test_build.py
      - name: Commit nhi.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhi.json
          git commit -m "Update nhi.json ($(date -u +%F))" || echo "nothing to commit"
          git push
